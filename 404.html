<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redirecting — Sikhi</title>
<!--
  GitHub Pages serves this file for any path inside the project site that does
  not exist, and Pages paths are CASE-SENSITIVE: /Sikhi-App/ 404s while
  /sikhi-app/ is the real one. Rather than show a dead end, bounce to the app.
  Absolute path on purpose — this site lives at /sikhi-app/.
-->
<meta http-equiv="refresh" content="0; url=/sikhi-app/">
<link rel="canonical" href="/sikhi-app/">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#fdf8f1; color:#3b2f22;
         font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         text-align:center; padding:24px; }
  a { color:#c8641b; }
</style>
<script>location.replace('/sikhi-app/');</script>
</head>
<body>
  <div>
    <p>Taking you to the Sikhi app…</p>
    <p><a href="/sikhi-app/">Open Sikhi — Nitnem &amp; Hukamnama</a></p>
  </div>
</body>
</html>
